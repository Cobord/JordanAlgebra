name = "Jordan"
version = "0.1.0"
defaultTargets = ["jordan"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Jordan"

[[lean_lib]]
name = "JordanDiagram"

# Files copied unmodified from the Stacks Project in Lean (AxiomMath/Stacks, Apache-2.0); see
# `Vendored/Stacks/README.md`. Built with that project's own Lean options.
[[lean_lib]]
name = "StacksVendored"
srcDir = "Vendored/Stacks"
roots = ["StacksFrontier.AlgebraicGeometry.GroupScheme.Examples.GeneralLinear",
  "StacksFrontier.AlgebraicGeometry.GroupScheme.Subgroups.Defs"]
globs = ["StacksCore.+", "StacksFrontier.+"]

[lean_lib.leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.flexible = true
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
weak.linter.overlappingInstances = false

[[lean_lib]]
name = "JordanCheck"
roots = ["JordanCheck.Challenge", "JordanCheck.Solution"]

[[lean_lib]]
name = "JordanDiagramCheck"
roots = ["JordanDiagramCheck.Challenge", "JordanDiagramCheck.Solution"]

# The aggregate challenge and solution named in `comparator.json` (run `lake comparator`).
[[lean_lib]]
name = "Check"
roots = ["Challenge", "Solution"]

[[lean_exe]]
name = "jordan"
root = "Main"
